services:
  amiberry:
    image: ghcr.io/sidick/amiberry:latest
    # To build locally from this checkout instead of pulling, uncomment:
    # build:
    #   context: .
    #   target: amiberry
    #   args:
    #     AMIBERRY_VERSION: "8.2.2"
    #     KASMVNC_VERSION: "1.4.0"
    container_name: amiberry
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      VNC_GEOMETRY: "1280x960"
      VNC_DEPTH: "24"
      VNC_USER: "amiberry"
      VNC_PASSWORD: "amiberry"
    volumes:
      - amiberry-config:/config
    shm_size: "512m"

  copperline-vnc:
    image: ghcr.io/sidick/copperline-vnc:latest
    # build:
    #   context: .
    #   target: copperline-vnc
    #   args:
    #     COPPERLINE_VERSION: "0.12.0"
    #     KASMVNC_VERSION: "1.4.0"
    container_name: copperline-vnc
    restart: unless-stopped
    ports:
      - "8444:8443"
    environment:
      VNC_GEOMETRY: "1280x960"
      VNC_DEPTH: "24"
      VNC_USER: "copperline"
      VNC_PASSWORD: "copperline"
    volumes:
      - copperline-vnc-config:/config
    shm_size: "512m"

volumes:
  amiberry-config:
  copperline-vnc-config:
