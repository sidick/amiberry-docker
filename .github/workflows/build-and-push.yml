name: Build and push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. latest, 8.2.2)"
        required: true
        default: "latest"
      app:
        description: "Which app image(s) to build"
        type: choice
        options: [both, amiberry, copperline]
        default: "both"

# Each app publishes its own image: ghcr.io/<owner>/amiberry and
# ghcr.io/<owner>/copperline, both built from the shared-base Dockerfile
# via --target.
#
# To also push to Docker Hub, uncomment the Docker Hub login steps below and
# the secondary tag in the `merge` job. You will need repo secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

jobs:
  build:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.app == 'both' && '["amiberry","copperline"]' || format('["{0}"]', inputs.app)) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive cache + artifact suffix
        id: meta
        run: |
          platform="${{ matrix.platform }}"
          echo "pair=${{ matrix.app }}-${platform//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.meta.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.pair }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.meta.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(inputs.app == 'both' && '["amiberry","copperline"]' || format('["{0}"]', inputs.app)) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${{ inputs.tag }}" \
            $(printf "${IMAGE}@sha256:%s " *)
          # To also publish to Docker Hub, add a second -t flag above, e.g.:
          # -t "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app }}:${{ inputs.tag }}"

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ inputs.tag }}"
