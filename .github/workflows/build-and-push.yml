name: Build and push

# Manual publish of one or both app images to GHCR at whatever tag you name.
# For automatic version-tagged publishes on upstream releases, see
# upstream-release.yml; the build itself lives in _build-image.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. latest, 8.2.2)"
        required: true
        default: "latest"
      app:
        description: "Which app image(s) to build"
        type: choice
        options: [both, amiberry, copperline-vnc]
        default: "both"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.app == 'both' && '["amiberry","copperline-vnc"]' || format('["{0}"]', inputs.app)) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-image.yml
    with:
      app: ${{ matrix.app }}
      tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ inputs.tag }}
